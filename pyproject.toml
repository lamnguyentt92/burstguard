[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "burstguard"
version = "0.3.3"
description = "BurstGuard: robustness study of federated fine-tuning of tiny time-series foundation models for cellular traffic forecasting"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Tran Thanh Lam Nguyen" }]
# Phụ thuộc được ghim trong requirements.txt và cài bằng scripts/setup_venv.sh.
# torch được cài riêng (bản CPU) nên không liệt kê ở đây để tránh pip kéo bản CUDA.
dependencies = []

[project.scripts]
burstguard = "burstguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
