# E2 - attack effectiveness without defense (RQ1/RQ2): 2 of 20 sites compromised, FedAvg.
# Model replacement (scale) in all 4 fine-tuning modes (3 seeds); plain data poisoning and the norm-bounded
# attack (constrain_scale) with head and LoRA (2 seeds). Clean reference: E1_clean (FL runs).
[grid]
name = "E2_attacks"
base_config = "configs/base.toml"
seeds = [0, 1, 2]

[fixed]
"fl.save_model" = true     # final models for the qualitative figure (burstguard paper)

[factors]
"attack.type" = ["scale", "poison", "constrain_scale"]
"train.peft" = ["head", "decoder", "lora", "full"]

[[exclude]]
"attack.type" = "poison"
"train.peft" = "decoder"
[[exclude]]
"attack.type" = "poison"
"train.peft" = "full"
[[exclude]]
"attack.type" = "constrain_scale"
"train.peft" = "decoder"
[[exclude]]
"attack.type" = "constrain_scale"
"train.peft" = "full"
[[exclude]]
"attack.type" = "poison"
"run.seed" = 2
[[exclude]]
"attack.type" = "constrain_scale"
"run.seed" = 2

[analysis]
split = "test"
