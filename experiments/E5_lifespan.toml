# E5 - backdoor lifespan (RQ2): attack only in rounds 10-19 of 50; L50 = rounds after the attack until
# validation ASR drops below half of its peak.
[grid]
name = "E5_lifespan"
base_config = "configs/base.toml"
seeds = [0, 1, 2]

[fixed]
"attack.type" = "scale"
"attack.start_round" = 10
"attack.end_round" = 20
"fl.rounds" = 50
"fl.eval_every" = 2
"defense.noise_multiplier" = 0.1

[factors]
"train.peft" = ["head", "decoder", "lora", "full"]
"defense.name" = ["fedavg", "clip_noise", "lora_reset", "burstguard"]

[[exclude]]
"defense.name" = "lora_reset"
"train.peft" = "head"
[[exclude]]
"defense.name" = "lora_reset"
"train.peft" = "decoder"
[[exclude]]
"defense.name" = "lora_reset"
"train.peft" = "full"

[analysis]
split = "test"
