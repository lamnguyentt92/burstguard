# P0 - pilot on the real data (run FIRST, ~2 h on the 5 VMs) with the v0.3.4 defaults (20 rounds, strong attacker:
# poison_frac 0.5 / 10 local epochs, cheap BurstGuard search: 8 steps, 1 restart, 32 probe windows).
# Questions: does the backdoor take hold with head-only and LoRA fine-tuning, does the norm-bounded attack
# (constrain_scale, bound = benign norm, or 3x with norm_mult = 3) implant, how well do the cheap BurstGuard scores
# separate clean from attacked rounds, and how long does a round take (for `burstguard plan`).
# Monitor mode: BurstGuard scores every round but never rejects (= FedAvg), so the attack is unfiltered.
[grid]
name = "P0_pilot"
base_config = "configs/base.toml"
seeds = [0]

[fixed]
"defense.name" = "burstguard"
"burstguard.mode" = "monitor"

[factors]
"train.peft" = ["head", "lora"]
"attack.type" = ["none", "scale", "constrain_scale"]

[[include]]
"train.peft" = "head"
"attack.type" = "constrain_scale"
"attack.norm_mult" = 3.0
[[include]]
"train.peft" = "lora"
"attack.type" = "constrain_scale"
"attack.norm_mult" = 3.0

[analysis]
split = "test"
