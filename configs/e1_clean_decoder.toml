# E1 — baseline SẠCH (không tấn công): FedAvg, chế độ fine-tune = decoder, dữ liệu Milan thật.
# Chuẩn bị:  burstguard data download  &&  burstguard data prepare
[run]
name = "e1_clean_decoder"
seed = 0

[data]
path = "data/processed/milan.npz"
num_sites = 20
context = 512
horizon = 36
train_stride = 3
eval_stride = 6

[model]
source = "hf"
path = "ibm-granite/granite-timeseries-ttm-r2"
revision = "auto"

[train]
peft = "decoder"
lr = 5e-4
batch_size = 64
local_epochs = 1
lora_r = 8
lora_alpha = 16

[fl]
rounds = 30
fraction_fit = 1.0
eval_every = 5

[sim]
num_cpus = 0          # 0 = tự động (số CPU - 1)
cpus_per_client = 1
torch_threads = 1
